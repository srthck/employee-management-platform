name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests (MongoDB replica set, transactions required)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start single-node MongoDB replica set
        working-directory: .
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 60); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done

      - run: npm ci

      - name: Run full suite with transactions required
        run: npm test -- "mongodb://localhost:27017/?replicaSet=rs0"
        env:
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long

  e2e:
    name: Browser end-to-end tests (critical workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Start single-node MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 60); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_MONGO_URI: mongodb://localhost:27017/payguard_e2e?replicaSet=rs0

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
