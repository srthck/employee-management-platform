<!DOCTYPE html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1424" />
    <meta name="description" content="PayGuard payroll and compliance operations." />
    <title>PayGuard | Payroll Operations</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%230A1424'/%3E%3Cpath d='M9.5 21.5V6.5h5.2a4.7 4.7 0 0 1 0 9.4H9.5' fill='none' stroke='%23F2EBE6' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='9.5' cy='21.5' r='2.6' fill='%23FF6A5C'/%3E%3C/svg%3E" />
    <script>
      // Applies the stored theme before first paint, so the page never shows
      // the default on its way to the chosen one. Mirrors contexts/ThemeContext.jsx.
      (function () {
        try {
          var t = localStorage.getItem('pg.theme');
          if (['midnight', 'graphite', 'aurora', 'daylight'].indexOf(t) > -1) {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* storage unavailable; the default stands */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
